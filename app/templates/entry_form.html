{% extends "base.html" %}
{% block content %}
<div class="card">
  {% if entry_id %}
  <h1>Edit entry</h1>
  <form method="post" action="/vault/{{ entry_id }}/edit">
  {% else %}
  <h1>New entry</h1>
  <form method="post" action="/vault/new">
  {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Title <input name="title" value="{{ entry.title or '' }}" maxlength="200" required></label>
    <label>Username <input name="username" value="{{ entry.username or '' }}" maxlength="256"></label>
    <label>Password <input type="password" name="password" value="{{ entry.password or '' }}" maxlength="4096"></label>
    <label>Website URL <input name="url" value="{{ entry.url or '' }}" maxlength="2048" placeholder="https://"></label>
    <label>Notes <textarea name="notes" maxlength="10000">{{ entry.notes or '' }}</textarea></label>
    <button type="submit">Save</button>
    <a href="/vault">Cancel</a>
  </form>
</div>
{% endblock %}
